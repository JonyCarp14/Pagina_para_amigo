{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 text-success fw-bold m-0"><i class="bi bi-plus-circle me-2"></i>Cargar Nuevo Producto</h2>
                <a href="/admin" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre del producto *</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej: Termo de Acero 1L" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Categoría *</label>
                        <input type="text" name="categoria" class="form-control" placeholder="Ej: Bazar, Lencería..." required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Precio ($) *</label>
                        <input type="number" step="0.01" name="precio" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Stock disponible *</label>
                        <input type="number" name="stock" class="form-control" value="1" min="0" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción detallada</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalles del producto, materiales, ventajas..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-upload me-1"></i>Subir fotos o videos desde el dispositivo</label>
                    <input type="file" name="archivos_locales" class="form-control" accept="image/*,video/*" multiple>
                    <small class="text-muted">Podés elegir fotos (JPG, PNG, WEBP) y videos cortos (MP4, WEBM).</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-link-45deg me-1"></i>O pegar URLs de fotos de la web</label>
                    <textarea name="imagen_url" class="form-control" rows="2" placeholder="Ej: https://sitio.com/foto.jpg"></textarea>
                </div>

                <!-- ESPECIFICACIONES DINÁMICAS -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label fw-bold m-0">Especificaciones (Talles, Colores, Medidas, etc.)</label>
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="agregarEspecificacion()">
                            <i class="bi bi-plus-lg me-1"></i>Agregar campo
                        </button>
                    </div>
                    <div id="contenedor-especificaciones" class="d-flex flex-column gap-2">
                        <div class="row g-2 espec-fila">
                            <div class="col-5">
                                <input type="text" name="espec_clave[]" class="form-control" placeholder="Atributo (Ej: Color)">
                            </div>
                            <div class="col-6">
                                <input type="text" name="espec_valor[]" class="form-control" placeholder="Valor (Ej: Azul)">
                            </div>
                            <div class="col-1">
                                <button type="button" class="btn btn-outline-danger w-100" onclick="eliminarFila(this)"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4 fw-bold"><i class="bi bi-check-circle me-1"></i>Crear Producto</button>
                    <a href="/admin" class="btn btn-light border px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function agregarEspecificacion() {
    const contenedor = document.getElementById('contenedor-especificaciones');
    const nuevaFila = document.createElement('div');
    nuevaFila.className = 'row g-2 espec-fila';
    nuevaFila.innerHTML = `
        <div class="col-5">
            <input type="text" name="espec_clave[]" class="form-control" placeholder="Atributo (Ej: Talle)">
        </div>
        <div class="col-6">
            <input type="text" name="espec_valor[]" class="form-control" placeholder="Valor (Ej: XL)">
        </div>
        <div class="col-1">
            <button type="button" class="btn btn-outline-danger w-100" onclick="eliminarFila(this)"><i class="bi bi-trash"></i></button>
        </div>
    `;
    contenedor.appendChild(nuevaFila);
}

function eliminarFila(btn) {
    btn.closest('.espec-fila').remove();
}
</script>
{% endblock %}
